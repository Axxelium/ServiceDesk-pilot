name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test against PostgreSQL and build
        run: ./mvnw -B --no-transfer-progress verify
      - name: Start application with PostgreSQL 17
        run: docker compose up -d --build
      - name: Wait for HTTP readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              curl --fail --silent --output /dev/null http://localhost:8080/swagger-ui/index.html
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run demo through real HTTP
        shell: pwsh
        run: ./scripts/demo.ps1
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
