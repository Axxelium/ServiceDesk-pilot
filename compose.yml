services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-servicedesk}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/servicedesk
      DB_USER: servicedesk
      DB_PASSWORD: ${DB_PASSWORD:-servicedesk}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
